
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <form action="#" method="post">

            <h2><span>Re</span>gistration</h2>

            <h3>Personal Details</h3>

            <div class="form-grid">

                <div class="input-box">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname"
                           placeholder="Enter your name" required>
                </div>

                <div class="input-box">
                    <label for="dob">Date of Birth</label>
                    <input type="text" id="dob" name="dob"
                           placeholder="Enter birth date" required>
                </div>

                <div class="input-box">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email"
                           placeholder="Enter your email" required>
                </div>

                <div class="input-box">
                    <label for="mobile">Mobile number</label>
                    <input type="tel" id="mobile" name="mobile"
                           placeholder="Enter mobile number" required>
                </div>

                <div class="input-box">
                    <label for="gender">Gender</label>
                    <input type="text" id="gender" name="gender"
                           placeholder="Enter your gender" required>
                </div>

                <div class="input-box">
                    <label for="occupation">Occupation</label>
                    <input type="text" id="occupation" name="occupation"
                           placeholder="Enter occupation" required>
                </div>

            </div>

            <h3 class="identity-heading">Identity Details</h3>

            <div class="form-grid">

                <div class="input-box">
                    <label for="idtype">ID Type</label>
                    <input type="text" id="idtype" name="idtype"
                           placeholder="Enter ID type" required>
                </div>

                <div class="input-box">
                    <label for="idnumber">ID Number</label>
                    <input type="text" id="idnumber" name="idnumber"
                           placeholder="Enter ID number" required>
                </div>

                <div class="input-box">
                    <label for="authority">Issue Authority</label>
                    <input type="text" id="authority" name="authority"
                           placeholder="Enter issue department" required>
                </div>

                <div class="input-box">
                    <label for="issuedate">Issue Date</label>
                    <input type="text" id="issuedate" name="issuedate"
                           placeholder="Enter ID issue date" required>
                </div>

                <div class="input-box">
                    <label for="state">Issue State</label>
                    <input type="text" id="state" name="state"
                           placeholder="Enter ID issue state" required>
                </div>

                <div class="input-box">
                    <label for="expirydate">Expiry Date</label>
                    <input type="text" id="expirydate" name="expirydate"
                           placeholder="Enter ID expiry date" required>
                </div>

            </div>

            <button type="submit" class="next-button">
                Next <span>→</span>
            </button>

        </form>
    </div>

</body>
</html>
