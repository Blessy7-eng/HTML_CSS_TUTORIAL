
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookMyShow Navbar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="main-header">
    <div class="top-navbar">

      <!-- BookMyShow Logo -->
      <a href="#" class="bms-logo" aria-label="BookMyShow">
        book<span class="my">my</span>show
      </a>

      <!-- Search Bar -->
      <div class="search-box">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.8" cy="10.8" r="6.5"></circle>
          <path d="m16 16 4.5 4.5"></path>
        </svg>
        <input
          type="search"
          placeholder="Search for Movies, Events, Plays, Sports and Activities"
          aria-label="Search"
        >
      </div>

      <!-- Right Side -->
      <div class="header-actions">

        <button class="city-button" type="button">
          Pune
          <span class="arrow">⌄</span>
        </button>

        <button class="sign-in" type="button">
          Sign in
        </button>

        <button class="menu-button" type="button" aria-label="Menu">
          <span></span>
          <span></span>
          <span></span>
        </button>

      </div>
    </div>

    <!-- Secondary Navigation -->
    <nav class="secondary-navbar">

      <div class="nav-left">
        <a href="#">Movies</a>
        <a href="#">Stream</a>
        <a href="#">Events</a>
        <a href="#">Plays</a>
        <a href="#">Sports</a>
        <a href="#">Activities</a>
      </div>

      <div class="nav-right">
        <a href="#">ListYourShow</a>
        <a href="#">Corporates</a>
        <a href="#">Offers</a>
        <a href="#">Gift Cards</a>
      </div>

    </nav>
  </header>

</body>
</html>
