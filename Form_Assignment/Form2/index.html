
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Login Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">

        <!-- Left Section -->
        <section class="left-section">

            <img src="assets/insta_logo.webp"
                 alt="Instagram"
                 class="instagram-logo">

            <div class="left-content">
                <h1>
                    See everyday moments from your
                    <span>close friends.</span>
                </h1>

                <img src="assets/reels_photo.webp"
                     alt="Instagram Reels preview"
                     class="reel-photo">
            </div>

        </section>

        <!-- Vertical Divider -->
        <div class="divider"></div>

        <!-- Right Section -->
        <section class="right-section">

            <div class="login-container">

                <h2>Log into Instagram</h2>

                <form class="login-form">

                    <input
                        type="text"
                        name="username"
                        placeholder="Mobile number, username or email"
                        autocomplete="off"
                        aria-label="Mobile number, username or email"
                    >

                    <input
                        type="password"
                        name="password"
                        placeholder="Password"
                        autocomplete="off"
                        aria-label="Password"
                    >

                    <!-- Visual demo only: does not submit credentials -->
                    <button type="button" class="login-button">
                        Log in
                    </button>

                </form>

                <a href="#" class="forgot-password">
                    Forgot password?
                </a>

                <div class="alternative-login">

                    <button type="button" class="facebook-button">
                        <span class="facebook-icon">f</span>
                        Log in with Facebook
                    </button>

                    <button type="button" class="create-account">
                        Create new account
                    </button>

                </div>

                <div class="meta-brand">
                    <span class="meta-symbol">∞</span>
                    <span>Meta</span>
                </div>

            </div>

        </section>

    </main>

</body>
</html>
