
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Image Collage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="collage">
    <!-- NATURE IMAGES -->

    <div class="nature sky">
        <svg width="0" height="0">
            <defs>
                <clipPath id="topCurve" clipPathUnits="objectBoundingBox">
                    <path d="M 0,1 L 0,0 Q 0.5,0.4 1,0 L 1,1 Z"/>
                </clipPath>
            </defs>
        </svg>
        <img src="assets/sky.jpg" alt="Sky">
    </div>

    <div class="nature winter">
        <svg width="0" height="0">
            <defs>
                <clipPath id="leftCurve" clipPathUnits="objectBoundingBox">
                    <path d="M 1,0 L 1,1 L 0,1 Q 0.4,0.5 0,0 Z"/>
                </clipPath>
            </defs>
        </svg>
        <img src="assets/winter.jpg" alt="Winter Forest">
    </div>

    <div class="nature green">
        <svg width="0" height="0">
            <defs>
                <clipPath id="rightCurve" clipPathUnits="objectBoundingBox">
                    <path d="M 0,0 L 1,0 Q 0.6,0.5 1,1 L 0,1 Z"/>
                </clipPath>
            </defs>
        </svg>
        <img src="assets/forest.jpg" alt="Green Forest">
    </div>

    <div class="nature water">
        <svg width="0" height="0">
            <defs>
                <clipPath id="bottomCurve" clipPathUnits="objectBoundingBox">
                    <path d="M 0,0 L 1,0 L 1,1 Q 0.5,0.6 0,1 Z"/>
                </clipPath>
            </defs>
        </svg>
        <img src="assets/water.jpg" alt="Water">
    </div>


    <!-- ANIMAL IMAGES -->

    <div class="animal wolf">
        <img src="assets/wolf.jpg" alt="Wolf">
    </div>

    <div class="animal tiger">
        <img src="assets/tiger.jpg" alt="Tiger">
    </div>

    <div class="animal lion">
        <img src="assets/lioness.jpg" alt="Lion">
    </div>

    <div class="animal dog">
        <img src="assets/husky.jpg" alt="Dog">
    </div>

    <div class="animal bear">
        <img src="assets/bear.jpg" alt="Bear">
    </div>

</div>

</body>
</html>
