
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navbar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="project-info">
      <div class="project-logo">
        <img src="assets/group.svg" alt="Project logo">
      </div>

      <div class="project-details">
        <h1>B101-WS-MERN-JFP</h1>
        <p>
          B101, B101Normal, B87, Swapnil, WS, WS_491, 491,
          8788, 7829, 491, 8452, 37342, 491, 80559
        </p>
      </div>
    </div>

    <div class="navbar-actions">
      <button class="add-list" type="button">
        <img src="assets/AddList.svg" alt="">
        <span>Add to list</span>
        <img src="assets/Dropdown.svg" alt="">
      </button>

      <button class="icon-button display-button" type="button" aria-label="Display options">
        <img src="assets/videocall.svg" alt="">
        <img src="assets/Dropdown.svg" alt="">
      </button>

      <button class="icon-button" type="button" aria-label="Search">
        <img src="assets/search.svg" alt="">
      </button>

      <button class="icon-button" type="button" aria-label="More options">
        <img src="assets/more.svg" alt="">
      </button>
    </div>
  </header>

</body>
</html>
