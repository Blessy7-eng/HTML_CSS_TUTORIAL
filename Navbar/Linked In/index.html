
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn Navbar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">

    <!-- LinkedIn Logo -->
    <a href="#" class="linkedin-logo" aria-label="LinkedIn">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect width="24" height="24" rx="2" fill="#0A66C2"/>
        <path fill="#fff" d="M5.2 9h3.1v10H5.2zM6.75 4.5a1.8 1.8 0 1 1 0 3.6 1.8 1.8 0 0 1 0-3.6M10.1 9h3v1.37h.04A3.3 3.3 0 0 1 16.1 8.7c3.2 0 3.8 2.1 3.8 4.8V19h-3.1v-4.9c0-1.17-.02-2.67-1.63-2.67-1.64 0-1.9 1.28-1.9 2.58V19h-3.17z"/>
      </svg>
    </a>

    <!-- Search -->
    <div class="search-box">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="10.8" cy="10.8" r="5.7"/>
        <path d="m15 15 4.2 4.2"/>
      </svg>
      <input type="search" placeholder="Search" aria-label="Search">
    </div>

    <div class="nav-items">

      <!-- Home -->
      <a href="#" class="nav-item active">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 10.5 12 3l9 7.5h-2V21h-5v-6h-4v6H5V10.5z" fill="currentColor"/>
        </svg>
        <span>Home</span>
      </a>

      <!-- My Network -->
      <a href="#" class="nav-item">
        <span class="icon-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="9" cy="7" r="3" fill="currentColor"/>
            <circle cx="17" cy="8" r="2.5" fill="currentColor"/>
            <path d="M3 19v-2a6 6 0 0 1 12 0v2z" fill="currentColor"/>
            <path d="M15 13a5 5 0 0 1 6 5v1h-4v-2a7 7 0 0 0-2-4z" fill="currentColor"/>
          </svg>
          <span class="badge red">5</span>
        </span>
        <span>My Network</span>
      </a>

      <!-- Jobs -->
      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="7" width="18" height="13" rx="1.5" fill="currentColor"/>
          <path d="M9 7V4h6v3M3 12h18M10 12v2h4v-2" fill="none" stroke="currentColor" stroke-width="1.7"/>
        </svg>
        <span>Jobs</span>
      </a>

      <!-- Messaging -->
      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3a9 8 0 0 0-7.2 12.4L4 20l4.8-2A9 8 0 1 0 12 3z" fill="currentColor"/>
          <path d="M8 10h8M8 13h5" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <span>Messaging</span>
      </a>

      <!-- Notifications -->
      <a href="#" class="nav-item">
        <span class="icon-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M9 21h6" fill="currentColor"/>
          </svg>
          <span class="badge red">25</span>
        </span>
        <span>Notifications</span>
      </a>

      <!-- Profile -->
      <a href="#" class="nav-item">
        <span class="profile-photo">
          <img src="https://i.pravatar.cc/60?img=47" alt="Profile">
        </span>
        <span>Me <span class="down">▾</span></span>
      </a>

      <!-- Business -->
      <a href="#" class="nav-item business">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1" fill="currentColor"/>
          <rect x="14" y="3" width="7" height="7" rx="1" fill="currentColor"/>
          <rect x="3" y="14" width="7" height="7" rx="1" fill="currentColor"/>
          <rect x="14" y="14" width="7" height="7" rx="1" fill="currentColor"/>
        </svg>
        <span>For Business <span class="down">▾</span></span>
      </a>

      <!-- Premium -->
      <a href="#" class="nav-item premium">
        <svg class="premium-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 4h14v16H5z" fill="#DCA64B"/>
          <path d="M8 7h8v10H8z" fill="#F8D99A"/>
          <path d="m8 7 4 3 4-3" fill="none" stroke="#DCA64B" stroke-width="1.5"/>
        </svg>
        <span>Try Premium for ₹0</span>
      </a>

    </div>
  </nav>

</body>
</html>
